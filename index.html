<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kuku's motor Beta</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(15px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; color: #222;
        }
        #overlay h1 { font-size: 70px; margin: 0; font-weight: 900; letter-spacing: -2px; }
        #play-btn { 
            background: #222; color: white; padding: 15px 60px; 
            font-size: 22px; border: none; cursor: pointer; margin-top: 20px;
            transition: 0.2s;
        }
        #play-btn:hover { background: #444; transform: scale(1.05); }

        #crosshair { 
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; 
            border: 2px solid #00ff00; border-radius: 50%; transform: translate(-50%, -50%); 
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>KUKU'S BETA</h1>
        <button id="play-btn">JUGAR</button>
    </div>

    <div id="crosshair"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.161.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xaaccff);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 1.0);
        sun.position.set(50, 100, 50);
        sun.castShadow = true;
        scene.add(sun);

        
        const obstacles = [];
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        function createBox(w, h, d, x, y, z) {
            const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: 0x777777 }));
            b.position.set(x, y, z);
            b.castShadow = true; b.receiveShadow = true;
            scene.add(b);
            obstacles.push(b);
        }
       
        createBox(100, 10, 2, 0, 5, 50); createBox(100, 10, 2, 0, 5, -50);
        createBox(2, 10, 100, 50, 5, 0); createBox(2, 10, 100, -50, 5, 0);
        // Cajas aleatorias
        for(let i=0; i<15; i++) createBox(4, 4, 4, (Math.random()-0.5)*70, 2, (Math.random()-0.5)*70);

        const enemy = new THREE.Mesh(
            new THREE.BoxGeometry(1.5, 3.5, 1.5), 
            new THREE.MeshStandardMaterial({ color: 0xff0000 })
        );
        enemy.position.set(20, 1.75, -20);
        enemy.castShadow = true;
        scene.add(enemy);

        
        const gun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.5), new THREE.MeshStandardMaterial({color: 0x000}));
        gun.position.set(0.3, -0.25, -0.4);
        camera.add(gun);
        scene.add(camera);

       
        let keys = {};
        let velocityY = 0;
        let canJump = true;
        const bullets = [];

        document.getElementById('play-btn').addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            document.getElementById('overlay').style.display = document.pointerLockElement === document.body ? 'none' : 'flex';
        });

        document.addEventListener('keydown', (e) => keys[e.code] = true);
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, camera.rotation.x));
            }
        });
        camera.rotation.order = 'YXZ';

        document.addEventListener('mousedown', () => {
            if (document.pointerLockElement === document.body) {
                const b = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({color: 0xffff00}));
                camera.getWorldPosition(b.position);
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                bullets.push({ mesh: b, dir: dir, t: 0 });
                scene.add(b);
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            const delta = 0.016;

            if (document.pointerLockElement === document.body) {
                
                const speed = keys['ShiftLeft'] ? 0.6 : 0.3;
                const f = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion); f.y = 0; f.normalize();
                const r = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion); r.y = 0; r.normalize();

                const next = camera.position.clone();
                if(keys['KeyW']) next.add(f.multiplyScalar(speed));
                if(keys['KeyS']) next.add(f.multiplyScalar(-speed));
                if(keys['KeyA']) next.add(r.multiplyScalar(-speed));
                if(keys['KeyD']) next.add(r.multiplyScalar(speed));

               
                let col = false;
                const pBox = new THREE.Box3().setFromCenterAndSize(next, new THREE.Vector3(1, 2, 1));
                for(let o of obstacles) { if(pBox.intersectsBox(new THREE.Box3().setFromObject(o))) col = true; }
                if(!col) { camera.position.x = next.x; camera.position.z = next.z; }

                velocityY -= 0.015;
                if(keys['Space'] && canJump) { velocityY = 0.25; canJump = false; }
                camera.position.y += velocityY;
                if(camera.position.y <= 1.6) { camera.position.y = 1.6; velocityY = 0; canJump = true; }

                
                const toP = new THREE.Vector3().subVectors(camera.position, enemy.position).normalize();
                enemy.position.add(toP.multiplyScalar(0.12));
                if(camera.position.distanceTo(enemy.position) < 1.7) {
                    location.reload(); // Muerte rápida
                }
            }

            
            for(let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].mesh.position.add(bullets[i].dir.clone().multiplyScalar(1.5));
                bullets[i].t++;
                if(bullets[i].mesh.position.distanceTo(enemy.position) < 2) {
                    scene.remove(bullets[i].mesh); bullets.splice(i, 1);
                    enemy.position.set((Math.random()-0.5)*70, 1.75, (Math.random()-0.5)*70);
                } else if(bullets[i].t > 100) { scene.remove(bullets[i].mesh); bullets.splice(i, 1); }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
